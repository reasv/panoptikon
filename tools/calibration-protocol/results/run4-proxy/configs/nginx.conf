worker_processes 1;
error_log /var/log/nginx/error.log warn;
events { worker_connections 256; }
http {
    access_log off;
    upstream gw_master        { server 127.0.0.1:6842; }
    upstream gw_master_trust  { server 127.0.0.1:6844; }
    upstream gw_master_legacy { server 127.0.0.1:6843; }
    upstream gw_branch        { server 127.0.0.1:6852; }
    upstream gw_branch_trust  { server 127.0.0.1:6854; }
    upstream gw_branch_legacy { server 127.0.0.1:6853; }
    upstream raw_dump         { server 127.0.0.1:6890; }

    # --- N1: proxy_set_header Host $host  (the documented nginx recipe) ---
    server { listen 127.0.0.1:6861;
        location / { proxy_pass http://gw_master;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $scheme; } }
    server { listen 127.0.0.1:6862;
        location / { proxy_pass http://gw_branch;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $scheme; } }

    # --- N2: no proxy_set_header Host: nginx sends its own upstream name.
    #        X-Forwarded-Host carries the real name. ---
    server { listen 127.0.0.1:6863;
        location / { proxy_pass http://gw_master;
            proxy_http_version 1.1;
            proxy_set_header X-Forwarded-Host $host; } }
    server { listen 127.0.0.1:6864;
        location / { proxy_pass http://gw_master_trust;
            proxy_http_version 1.1;
            proxy_set_header X-Forwarded-Host $host; } }
    server { listen 127.0.0.1:6865;
        location / { proxy_pass http://gw_branch;
            proxy_http_version 1.1;
            proxy_set_header X-Forwarded-Host $host; } }
    server { listen 127.0.0.1:6866;
        location / { proxy_pass http://gw_branch_trust;
            proxy_http_version 1.1;
            proxy_set_header X-Forwarded-Host $host; } }

    # --- N3: legacy [[server.endpoints]] port behind the proxy ---
    server { listen 127.0.0.1:6867;
        location / { proxy_pass http://gw_master_legacy;
            proxy_http_version 1.1;
            proxy_set_header Host $host; } }
    server { listen 127.0.0.1:6868;
        location / { proxy_pass http://gw_branch_legacy;
            proxy_http_version 1.1;
            proxy_set_header Host $host; } }

    # --- N4: raw capture of exactly what nginx sends upstream (N2 shape) ---
    server { listen 127.0.0.1:6869;
        location / { proxy_pass http://raw_dump;
            proxy_http_version 1.1;
            proxy_set_header X-Forwarded-Host $host; } }

    # --- N5: h2c upstream (nginx 1.29 `proxy_http_version 2`) ---
    server { listen 127.0.0.1:6877;
        location / { proxy_pass http://gw_master;
            proxy_http_version 2;
            proxy_set_header Host $host; } }
    server { listen 127.0.0.1:6878;
        location / { proxy_pass http://gw_branch;
            proxy_http_version 2;
            proxy_set_header Host $host; } }
    server { listen 127.0.0.1:6879;
        location / { proxy_pass http://gw_master;
            proxy_http_version 2;
            proxy_set_header X-Forwarded-Host $host; } }
    server { listen 127.0.0.1:6880;
        location / { proxy_pass http://gw_branch;
            proxy_http_version 2;
            proxy_set_header X-Forwarded-Host $host; } }
    server { listen 127.0.0.1:6881;
        location / { proxy_pass http://gw_master_trust;
            proxy_http_version 2;
            proxy_set_header X-Forwarded-Host $host; } }
    server { listen 127.0.0.1:6882;
        location / { proxy_pass http://gw_branch_trust;
            proxy_http_version 2;
            proxy_set_header X-Forwarded-Host $host; } }
    upstream h2dump { server 127.0.0.1:6891; }
    server { listen 127.0.0.1:6888;
        location / { proxy_pass http://h2dump;
            proxy_http_version 2;
            proxy_set_header Host $host; } }
    server { listen 127.0.0.1:6889;
        location / { proxy_pass http://h2dump;
            proxy_http_version 2;
            proxy_set_header X-Forwarded-Host $host; } }
}
