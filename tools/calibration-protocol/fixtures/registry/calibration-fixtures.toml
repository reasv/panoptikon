# User registry for the calibration protocol's fault-injection fixtures.
# Phase 0 of docs/batch-calibration-test-protocol.md (§3, "fixture" row of the
# models table); shape copied from the manager's test registry
# (panoptikon/src/inferio/manager.rs, TEST_REGISTRY_TOML) and
# config/inference/example.toml.
#
# Two families of the same four behaviours:
#
#   *_cpu   the shipped torch-free fixtures in
#           python/tests/inferio_worker/fixture_impls/. They never touch CUDA,
#           so the worker reports no gpu_uuid and no base_mb: resolve_board()
#           cannot place them and they run UNPRICED. Phase 4 measured this on
#           C2 as well: the single-board fallback needs gpu_bdf or gpu_total_mb
#           (ledger.rs:1821), which a torch-free worker never sends, so one
#           visible board does NOT rescue them (results/run1/S5-cpu-C2).
#   *_cuda  the variants in ../impls/, which allocate and touch one small CUDA
#           tensor in load(). They report gpu_uuid + gpu_name + gpu_total_mb
#           and a base_mb on the "nvml" tier, so the ledger admits them to a
#           board and prices their windows. These are the ones to use on C1.
#           Measured on this host at load_mb = 64: base_mb 722, base_method
#           "nvml", reserved_at_load_mb 64 (the rest is the CUDA context).
#
# Install: either point [inference_local].config_dirs at this directory (see
# ../README.md) or run ../install-fixtures.sh, which copies this file into
# config/inference/ and the impls into inferio_custom/.

# Never shadow a shipped inference_id by accident.
allow_override = false

[group.calibfixture]
config.impl_class = "echo_test"   # overridden per inference_id below

[group.calibfixture.metadata]
name                 = "Calibration protocol fixtures"
description          = """Fault-injection fixtures for the batch-calibration \
  test protocol: deterministic OOM on the second batch, batch-1 OOM, non-OOM \
  merged-batch failure, and worker death on demand. Not a real model."""
default_batch_size   = 64
default_inference_id = "oom_second_batch_cuda"
target_entities      = ["items"]
# NOTE: the fixtures return {"batch": n} / {"ok": true}, not tags. Drive them
# through POST /api/inference/predict/<id> (loadgen.py), not through an
# extraction job -- an extraction job would reject the payload because it does
# not match the declared output_type. The declaration is here only because the
# registry expects one.
output_type          = "tags"
input_mime_types     = ["image/"]

# item/count, like the wd taggers: one unit per input, so a window's units are
# just its length and the ramp is the cleanest to read.
[group.calibfixture.metadata.cost]
unit        = "item"
aggregation = "count"
epoch       = 1
seed_units  = 8

[group.calibfixture.metadata.input_spec]
handler = "image_frames"

# --- CUDA-touching variants (use these on C1: priced, board-resolved) ---

# Succeeds on batch 1, then raises the bare driver OOM text on batch 2 of the
# same worker. Exactly `oom_batches` batches OOM (see ../README.md).
[group.calibfixture.inference_ids.oom_second_batch_cuda]
config.impl_class = "oom_second_batch_cuda_test"
config.load_mb    = 64
config.oom_batches = 1
metadata.description = "OOMs once, on the second GPU batch (CUDA-touching, priced)"

# Always raises INFERENCE_OOM_BATCH_SIZE_1: the "even one item does not fit"
# path, which no amount of deflation can rescue.
[group.calibfixture.inference_ids.oom_cuda]
config.impl_class = "oom_cuda_test"
config.load_mb    = 64
metadata.description = "Batch-1 OOM every time (CUDA-touching, priced)"

# Non-OOM failure for any merged batch; singles succeed. Exercises the
# per-request fallback without the OOM classifier firing.
[group.calibfixture.inference_ids.failbatch_cuda]
config.impl_class = "failbatch_cuda_test"
config.load_mb    = 64
metadata.description = "Fails merged batches with a non-OOM error (CUDA-touching, priced)"

# B11 probe: a NON-memory failure whose text merely contains "out of memory".
# `message_reports_oom` (ledger.rs:4119) classifies on that substring, so this
# id answers whether a harmless error can deflate a healthy model.
[group.calibfixture.inference_ids.failbatch_oomtext_cuda]
config.impl_class = "failbatch_cuda_test"
config.load_mb    = 64
config.message    = "refusing merged batch of {n}: the caption cache is out of memory slots"
metadata.description = "Non-OOM merged-batch failure whose text contains 'out of memory' (B11)"

# Batch-1 OOM for the first `oom_secs` after load, healthy afterwards. The only
# fixture that can show `deflation` climbing AND recovering on one resident
# worker (protocol §4 S5: "how long does recovery take once you switch to a
# healthy model on the same replica").
[group.calibfixture.inference_ids.oom_timed_cuda]
config.impl_class = "oom_timed_cuda_test"
config.load_mb    = 64
config.oom_secs   = 120
metadata.description = "Batch-1 OOM for 120 s after load, then healthy (CUDA-touching, priced)"

# Raises inside load(): the model never becomes resident. Measures the respawn
# cadence and the time a request stream takes to fail (finding B15).
[group.calibfixture.inference_ids.dies_on_load_cuda]
config.impl_class = "dies_on_load_cuda_test"
config.load_mb    = 64
metadata.description = "Fails in load() every time (CUDA-touching)"

# os._exit(3) inside predict: worker death with a request in flight.
[group.calibfixture.inference_ids.dying_cuda]
config.impl_class = "dying_cuda_test"
config.load_mb    = 64
metadata.description = "Kills its worker mid-predict (CUDA-touching, priced)"

# --- torch-free originals (unpriced on C1; single-board fallback on C2) ---

[group.calibfixture.inference_ids.oom_second_batch_cpu]
config.impl_class = "oom_second_batch_test"
metadata.description = "OOMs on the second GPU batch (torch-free)"

[group.calibfixture.inference_ids.oom_cpu]
config.impl_class = "oom_test"
metadata.description = "Batch-1 OOM every time (torch-free)"

[group.calibfixture.inference_ids.failbatch_cpu]
config.impl_class = "failbatch_test"
metadata.description = "Fails merged batches with a non-OOM error (torch-free)"

[group.calibfixture.inference_ids.dying_cpu]
config.impl_class = "dying_test"
metadata.description = "Kills its worker mid-predict (torch-free)"

# B17 probe: ignores an orchestrator trim for 70 s, past the fatal 60 s
# TRIM_DEADLINE (worker.rs:113). Each predict allocates and frees `pool_mb`
# so the replica reports pool growth over TRIM_SLACK_MB (256 MB) while idle,
# which is what makes `flag_trims_locked` pick it when a neighbour on the same
# board is squeezed. See ../impls/hang_trim_cuda_impl.py.
[group.calibfixture.inference_ids.hang_trim_cuda]
config.impl_class = "hang_trim_cuda_test"
config.load_mb    = 64
config.pool_mb    = 512
config.hang_secs  = 70
metadata.description = "Ignores a trim for 70 s, past the 60 s TRIM_DEADLINE (B17)"
