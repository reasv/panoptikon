# C7 user registry (docs/batch-calibration-test-protocol.md §3, configuration
# C7): the multi-GPU pin and the easyOCR acceptance test.
#
# Loaded through [inference_local].config_dirs in server-C7.toml, after the
# shipped python/inferio/config and config/inference.
#
# `allow_override = true` is required because both entries below REDEFINE a
# shipped inference id. Redefinition replaces the id's config AND its
# id-level metadata wholesale (registry.rs module docs, config.py:71-76), so
# every key that matters is restated here -- in particular
# `metadata.cost`, which would otherwise fall back to the group's default
# (doctr's item/count, wrong for easyocr) instead of the id's own
# pixel/max-times-count.
allow_override = true

# --- The pin (S7, and C7's definition) -------------------------------------
# GPU 1 of this host (nvidia-smi index 1) by UUID. A UUID bypasses the index
# mapping entirely (registry.rs: `GPU-…` is passed through to the backend's
# pin form), which is what makes the pin readable in the worker's
# CUDA_VISIBLE_DEVICES and in PANOPTIKON_DEVICE_PIN.
[group.clip.inference_ids.apple_MobileCLIP-S1]
config.model_name    = "MobileCLIP-S1"
config.pretrained    = "datacompdr"
config.devices       = ["GPU-01c61d5b-6b4c-bd6a-019b-150586096a47"]
metadata.description = "Apple MobileCLIP-S1 (C7: pinned to GPU 1)"

# --- The easyOCR acceptance test -------------------------------------------
# Identical to the shipped doctr/easyocr_standard_en except for
# `enable_batching = true`. The shipped entry keeps it false as the
# work-around for the CRAFT detector's uniform-dims OOM trap; the packing
# harness's largest-first bucketing for max-times-count models is the
# mechanism meant to retire the flag, and flipping it under real core
# pipelining is the acceptance test the design doc defers to this protocol.
[group.doctr.inference_ids.easyocr_standard_en]
config.impl_class      = "easyocr"
config.languages       = ["en"]
config.enable_batching = true
metadata.description = "(C7) EasyOCR English, batching ENABLED for the acceptance test"
metadata.cost.unit        = "pixel"
metadata.cost.aggregation = "max-times-count"
metadata.cost.seed_units  = 2000000
# CALIB, run2: the shipped entry gained `epoch = 2` and
# `canvas_pixels = 6553600` when R7 landed (the CRAFT detector's 2560px
# canvas: no submitted image can cost it more than 2560^2 decoded pixels).
# A redefinition replaces the id's metadata WHOLESALE (registry.rs
# `merge_registry_file`: the id's metadata table is inserted, not merged),
# and a canvas is never inherited from a group that resolves to a different
# unit -- so omitting these two keys here silently runs C7 *uncapped* and
# on the pre-R7 unit denomination, which is the opposite of what the S8
# ocr-C7 leg measures. Restated verbatim from
# python/inferio/config/inference.toml.
metadata.cost.epoch         = 2
metadata.cost.canvas_pixels = 6553600
