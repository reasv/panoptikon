# ==========================================================================
# Calibration protocol user registry: C7nc  ("C7, no canvas")
#
# C7 with ONE line removed: `metadata.cost.canvas_pixels` on
# doctr/easyocr_standard_en. Nothing else differs -- same
# `enable_batching = true`, same unit/aggregation/seed, same epoch.
#
# Why it exists (run2, Phase D1). C7 measured the easyOCR acceptance test
# 3.3x SLOWER than the same binary with batching off, where run1 measured it
# 8.5x faster than master's per-image path. The suspect is R7's per-item
# canvas cap interacting with the impl:
#
#   * `packing.plan_batches` buckets a `max-times-count` model largest-first
#     by *priced* units. With the cap, every input at or above 2560^2 raw
#     pixels prices identically (6 553 600), so a 2480x3508 scan and an
#     8000x6000 sheet become indistinguishable to the sort and can share a
#     batch.
#   * `inferio/impl/eocr.py::pad_images_to_same_size` pads every member of a
#     mixed batch to the largest member's RAW dimensions before
#     `readtext_batched`, so the scan is inflated 5.5x in area and every
#     member pays the sheet's canvas.
#
# Uncapped, the raw pixel count is the sort key, the sheets sort strictly
# above the scans, and the buckets are size-homogeneous -- the property
# run1's PASS rested on. This registry is the control that separates "the
# cap did it" from "batching was never a win on this corpus". It is a
# DIAGNOSTIC, not a proposed configuration: dropping the canvas would put
# the model back on raw-pixel pricing, which is F-B/W1.
#
# SINCE THE run2 D1-b FIX, REMOVING THE REGISTRY KEY IS NO LONGER ENOUGH.
# `inferio.impl.eocr` now states its own canvas (`canvas_pixels =
# canvas_size**2`) and the worker reports it on the `load ok` response, so
# tier 2 of the resolution order fills the gap the registry leaves and C7nc
# would come out capped at 6 553 600 anyway. `config.canvas_size` below is
# what actually removes the cap: it raises the impl's stated canvas above
# any real image, so the reported figure caps nothing and `fit_to_canvas`
# never downscales. See config/README.md, "Running an uncapped control".
#
# Used as:  run-gateway.sh C7nc <root dir>   (ports 6392/6393/6389)
# ==========================================================================

# `allow_override = true` is required because both entries below REDEFINE a
# shipped inference id (registry-C7.toml carries the same key and the same
# reason). A redefinition replaces the id WHOLESALE, so every key that
# matters is restated -- in particular `metadata.cost`.
allow_override = true

[group.clip.inference_ids.apple_MobileCLIP-S1]
config.model_name    = "MobileCLIP-S1"
config.pretrained    = "datacompdr"
config.devices       = ["GPU-01c61d5b-6b4c-bd6a-019b-150586096a47"]
metadata.description = "Apple MobileCLIP-S1 (C7: pinned to GPU 1)"

# --- The easyOCR acceptance test -------------------------------------------
# Identical to the shipped doctr/easyocr_standard_en except for
# `enable_batching = true`. The shipped entry keeps it false as the
# work-around for the CRAFT detector's uniform-dims OOM trap; the packing
# harness's largest-first bucketing for max-times-count models is the
# mechanism meant to retire the flag, and flipping it under real core
# pipelining is the acceptance test the design doc defers to this protocol.
[group.doctr.inference_ids.easyocr_standard_en]
config.impl_class      = "easyocr"
config.languages       = ["en"]
config.enable_batching = true
metadata.description = "(C7) EasyOCR English, batching ENABLED for the acceptance test"
metadata.cost.unit        = "pixel"
metadata.cost.aggregation = "max-times-count"
metadata.cost.seed_units  = 2000000
# CALIB, run2: the shipped entry gained `epoch = 2` and
# `canvas_pixels = 6553600` when R7 landed (the CRAFT detector's 2560px
# canvas: no submitted image can cost it more than 2560^2 decoded pixels).
# A redefinition replaces the id's metadata WHOLESALE (registry.rs
# `merge_registry_file`: the id's metadata table is inserted, not merged),
# and a canvas is never inherited from a group that resolves to a different
# unit -- so omitting these two keys here silently runs C7 *uncapped* and
# on the pre-R7 unit denomination, which is the opposite of what the S8
# ocr-C7 leg measures. Restated verbatim from
# python/inferio/config/inference.toml.
metadata.cost.epoch         = 2
# metadata.cost.canvas_pixels = 6553600   # C7nc: DELIBERATELY ABSENT (see the header)

# The second half of "no canvas", and the half the registry cannot express.
# 40 000 px is far above the longest side of anything in the corpus (the
# largest is 8 000), so `fit_to_canvas` is the identity on every input and the
# impl reports `canvas_pixels = 1 600 000 000` -- a cap that caps nothing, so
# both sides price at the raw pixel count. It stays inside `Option<u32>`
# (`inferio/cost.rs:154`), which a larger figure would not. easyOCR's own
# detector is untouched by this: `canvas_size` reaches `Reader.detect` only as
# a per-request parameter, never from this config, so CRAFT still resizes onto
# its own 2560 px canvas and this control changes pricing and packing ONLY.
config.canvas_size = 40000
