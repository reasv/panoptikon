# Windows and macOS check: builds the workspace for the two shipped non-Linux
# targets with warnings as errors, runs the platform-specific Rust tests and
# the inference worker's tests natively. Manual dispatch only, like nix.yml;
# run it before tagging, since release.yml is the only other place these
# targets are built.
name: platforms

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: platforms-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  check:
    name: Check (${{ matrix.triple }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      RUSTFLAGS: -D warnings
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            triple: x86_64-pc-windows-msvc
          - os: macos-latest
            triple: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      # The uv release `panoptikon setup` pins (setup.rs UV_VERSION).
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.28"

      # tauri-build requires the sidecar and, on macOS, the framework dylib
      # to exist; release.yml stages the real ones.
      - name: Stage placeholder Desktop resources
        run: |
          set -euo pipefail
          ext=""; if [ "$RUNNER_OS" = "Windows" ]; then ext=".exe"; fi
          mkdir -p panoptikon-desktop/src-tauri/binaries panoptikon-desktop/src-tauri/resources/pdfium
          touch "panoptikon-desktop/src-tauri/binaries/panoptikon-${{ matrix.triple }}${ext}"
          touch panoptikon-desktop/src-tauri/resources/pdfium/libpdfium.dylib

      - name: Check
        run: cargo check --workspace --all-targets --features panoptikon/bundled

      - name: Platform tests
        if: ${{ !cancelled() }}
        run: cargo test -p panoptikon --bin panoptikon -- ownership inferio::mps inferio::cpu

      - name: Worker tests
        if: ${{ !cancelled() }}
        working-directory: python
        run: |
          uv sync --locked --group test --extra cpu
          uv run --no-sync python -m pytest tests/inferio_worker

      # Reports and does not gate.
      - name: Clippy
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: cargo clippy --workspace --all-targets --features panoptikon/bundled
