# Nix packaging: format/pin checks, package smokes, NixOS VMs, manual lock/pin PR.
#
# The `ui` git submodule is NEVER updated by automation — only maintainers bump
# it. Automation only realigns ui-pin.json (rev + source NAR hash) to the
# current gitlink. npm deps use importNpmLock (package-lock.json); not pinned.
#
# Manual dispatch ONLY by design: no push, pull_request, or scheduled runs.
# Only tagged releases are installable, so nothing on master or on a PR needs
# to be validated between releases (formatting included). Run this workflow
# (and the dispatch `update` job, or scripts/sync-nix-ui-pin.py) before
# tagging; between releases the pin may go stale harmlessly.
#
# Uses cache.nixos.org only (no Magic Nix Cache / GHA cache proxy).
# Package install checks and NixOS VMs run as separate matrices so a slow VM
# does not block light smokes. Determinate installer enables KVM when available.
name: nix

on:
  workflow_dispatch:
    inputs:
      update:
        description: "Also run the flake.lock/pin update job (opens a PR)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: nix-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Light and fast: flake formatting. The UI pin is NOT checked here — it is
  # release-time state (see the update job / release checklist), and between
  # releases it may legitimately be stale since master is not installable.
  check:
    if: "!inputs.update"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: false

      - uses: DeterminateSystems/nix-installer-action@v22

      - name: Flake formatter check (alejandra via nix)
        run: nix build .#checks.x86_64-linux.alejandra -L

  # Package/cli smokes (no QEMU).
  packages:
    if: "!inputs.update"
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        check:
          - panoptikon-cli
          - panoptikon-install
          - panoptikon-cpu-install
          - panoptikon-cuda-install
          - panoptikon-rocm-install
          - panoptikon-desktop-install
          - panoptikon-desktop-cpu-install
          - panoptikon-desktop-cuda-install
          - panoptikon-desktop-rocm-install
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: false

      - uses: DeterminateSystems/nix-installer-action@v22

      - name: nix build check
        run: |
          set -euo pipefail
          echo "==== checks.x86_64-linux.${{ matrix.check }} ===="
          nix build ".#checks.x86_64-linux.${{ matrix.check }}" -L

  # NixOS VM smokes (KVM when DETERMINATE_NIX_KVM=1 from the installer).
  # Same gating as `packages`.
  nixos:
    if: "!inputs.update"
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        check:
          - panoptikon-nixos
          - panoptikon-nixos-gpu-cpu
          - panoptikon-nixos-gpu-rocm
          - panoptikon-nixos-gpu-cuda
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: false

      - uses: DeterminateSystems/nix-installer-action@v22

      - name: KVM availability
        run: |
          set -euo pipefail
          if [[ -e /dev/kvm ]]; then
            echo "KVM device present"
            ls -l /dev/kvm || true
          else
            echo "warning: /dev/kvm missing; NixOS tests use TCG (slower)" >&2
          fi

      - name: nix build NixOS check
        run: |
          set -euo pipefail
          echo "==== checks.x86_64-linux.${{ matrix.check }} ===="
          nix build ".#checks.x86_64-linux.${{ matrix.check }}" -L

  update:
    if: inputs.update
    runs-on: ubuntu-latest
    # Serialize maintenance so concurrent dispatches do not race.
    concurrency:
      group: nix-update
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
        with:
          # Submodule contents not required; gitlink is enough for pin sync.
          # Never run `git submodule update --remote` here — ui is manual only.
          submodules: false
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: DeterminateSystems/nix-installer-action@v22

      - name: nix flake update
        run: nix flake update

      - name: Sync UI pin to current submodule gitlink
        run: |
          # Aligns ui-pin.json (rev + NAR hash) with the *existing* ui gitlink.
          # Does not change the submodule pointer itself.
          python3 scripts/sync-nix-ui-pin.py

      - name: Format Nix (flake formatter / nix fmt)
        run: nix fmt

      # Nothing runs on the opened PR (no pull_request trigger by policy), so
      # validate pin + light package smokes here before opening it so the
      # maintenance branch is not untested.
      - name: Validate pin and light smokes
        run: |
          set -euo pipefail
          python3 scripts/sync-nix-ui-pin.py --check
          nix build .#checks.x86_64-linux.alejandra -L
          nix build .#checks.x86_64-linux.panoptikon-cli -L
          nix build .#checks.x86_64-linux.panoptikon-install -L

      - name: Create pull request if anything changed
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "chore(nix): update flake.lock and UI pin"
          title: "chore(nix): update flake.lock and UI pin"
          body: |
            Automated maintenance (does **not** bump the `ui` git submodule):

            - `nix flake update` → `flake.lock` (nixpkgs, flake-utils, …)
            - `scripts/sync-nix-ui-pin.py` → refresh `ui-pin.json` for the
              **current** `ui` gitlink (rev + source NAR hash; npm via lockfile)
            - `nix fmt` (flake formatter = alejandra) on all `*.nix` files
            - **Pre-PR validation in this job** (no PAT): pin `--check`,
              alejandra, `panoptikon-cli`, `panoptikon-install`

            The monorepo `ui` submodule is only updated by maintainers. If the
            pin rev is already correct, this PR may only touch hashes/lock
            inputs.

            **Note:** no CI runs on this PR (this workflow is manual dispatch
            only by policy). Light smokes above ran on the update job itself;
            dispatch the full `nix` workflow manually if you want the whole
            package/VM matrix before merging.

            Review before merge.
          branch: chore/nix-update
          delete-branch: true
