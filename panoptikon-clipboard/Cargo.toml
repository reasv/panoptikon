[package]
name = "panoptikon-clipboard"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
description = "OS-native file-reference clipboard writes shared by the Panoptikon server and desktop app"

[dependencies]
anyhow = "1"

[target.'cfg(windows)'.dependencies]
clipboard-win = "5"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSPasteboard"] }
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "NSArray",
    "NSString",
    "NSURL",
] }

[dev-dependencies]
tempfile = "3"
