# Seeded once to <stateDir>/config/server/default.toml (never overwritten).
# Layout under --root: config/, data/, runtime/{pysrc,ui,venv}/.
# Tools: bare names on PATH; fonts via FONTCONFIG_FILE; pdfium after setup.

data_folder = "data"

[logging]
file = ""
level = "${LOGLEVEL:-INFO}"

[server]
host = "${PANOPTIKON_HOST:-127.0.0.1}"
port = "${PANOPTIKON_PORT:-6342}"
# X-Forwarded-* headers are not trusted by default (the code default;
# spoofable on a public bind). Uncomment only behind a trusted reverse
# proxy that sets those headers.
# trust_forwarded_headers = true

[upstreams.ui]
base_url = "http://127.0.0.1:6340"
local = true
# Embedded UI (bundled-ui); no checkout under stateDir.
dir = "no-checkout-use-embedded-bundle"
node = "node"

[upstreams.api]
base_url = "http://127.0.0.1:${PANOPTIKON_PORT:-6342}"
local = true

[inference_local]
enabled = true

[inference_local.python_env]
accelerator = "${PANOPTIKON_ACCELERATOR:-auto}"
auto_setup = "${PANOPTIKON_AUTO_SETUP:-true}"

# How much of each GPU the inference orchestrator may admit work into. Two
# composable limits; when both are set the budget is the min. The header below
# is live and the table deliberately empty: an empty table freezes nothing —
# every absent key tracks its built-in default across upgrades — while giving
# the keys a section to belong to. Uncommenting a bare `margin = …` with no
# header above it would otherwise land it in whichever table precedes this one.
[inference_local.vram]
# Margin over OTHER processes' VRAM usage (our own workers are measured, never
# inflated): usable = total - other_used * (1 + margin). Default 0.10, on.
# margin = 0.10
# Hard ceiling as a fraction of the board's total VRAM; the server lever for
# partitioning one card between services. Default: off.
# cap_fraction = 0.90

# Per-GPU-instance overrides, keyed by board UUID (`nvidia-smi -L` prints
# them). Two identical cards share a calibration profile but can carry
# different budgets — e.g. the one driving the monitors gets a bigger margin.
# Absent keys inherit the section defaults above. Uncomment BOTH lines: the
# value on its own would join [inference_local.vram] and move every board.
# [inference_local.vram.gpu."GPU-1a2b3c4d-5e6f-7890-abcd-ef1234567890"]
# margin = 0.25

[search]
# Tunable default lives in serde; comment so upgrades track code defaults.
# embedding_cache_size = 1024

[jobs]
ffmpeg = "ffmpeg"
ffprobe = "ffprobe"
pdfium = "${PDFIUM_PATH:-}"
html_renderer = "${HTML_RENDERER_PATH:-}"
thumbnail_font = "${PANOPTIKON_FONT:-}"

[rulesets.allow_all]
allow_all = true

[rulesets.restricted_demo]
allow = [
    { methods = [
        "GET",
    ], path_prefix = "/docs" },
    { methods = [
        "GET",
    ], path = "/openapi.json" },

    { methods = [
        "GET",
        "POST",
    ], path_prefix = "/api/search/" },
    { methods = [
        "GET",
    ], path_prefix = "/api/items/" },

    { methods = [
        "GET",
        "POST",
        "DELETE",
        "PUT",
    ], path_prefix = "/api/bookmarks/" },

    { methods = [
        "GET",
    ], path = "/api/db" },

    { methods = [
        "GET",
    ], path = "/api/inference/cache" },
]

[[policies]]
name = "localhost"
ruleset = "allow_all"

[policies.match]
hosts = ["localhost", "127.0.0.1"]

[policies.index_db]
default = "default"
allow = "*"

[policies.user_data_db]
default = "default"
allow = "*"

# Seeded policy is loopback-only. Non-loopback / public exposure needs a Host
# policy and auth (prefer restricted_demo), not bare allow_all.
