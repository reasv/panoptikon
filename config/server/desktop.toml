# Panoptikon Server configuration owned by Panoptikon Desktop.
# Materialized once under the Desktop Server root and user-owned thereafter.
# data_folder defaults to "data" (relative to the Server root). Uncomment to
# override; commented lines track the built-in default across app upgrades.
# data_folder = "data"

[server]
host = "127.0.0.1"
port = 6342
check_for_updates = false

[upstreams.ui]
base_url = "http://127.0.0.1:6340"
local = true
dir = "runtime/desktop-ui-bundle"

[upstreams.api]
base_url = "http://127.0.0.1:6342"
local = true

[inference_local]
enabled = true

# How many models may load their weights into one GPU at a time. Default 1;
# every unpinned model uses the same default GPU, so loads are serialized.
# Raising it is safe: each load reserves its expected memory up front.
# max_concurrent_loads = 1

# Per-model cooldown after a failed load, in seconds: doubles per consecutive
# failure up to the max and clears on a successful load. While it is armed,
# predict and load answer 503 + Retry-After. 0 disables it.
# load_failure_cooldown_secs = 2
# load_failure_cooldown_max_secs = 300

[inference_local.python_env]
# auto_setup defaults to true. Uncomment to override — commented keys track
# the built-in defaults on upgrade.
# auto_setup = true
# Packagers may set PANOPTIKON_ACCELERATOR (e.g. rocm/cuda); default is auto-detect.
# This ${VAR} bridge only expands as a live line, so it does not track defaults.
accelerator = "${PANOPTIKON_ACCELERATOR:-auto}"

# How much of each GPU the inference orchestrator may admit work into. When
# both limits are set, the lower budget wins. Keep this header live (the table
# may stay empty) so uncommented keys land in the right table.
[inference_local.vram]
# Margin over other processes' VRAM usage, as a fraction (not a percentage:
# values above 1.0 are clamped with a warning). Unset is NOT the same as 0.10:
# unset uses 0.10 but withholds at most 1 GiB and, except on a Mac, at least
# 3 % of the GPU (exactly 1 GiB on an NVIDIA GPU under Windows or WSL2), a
# set value applies as written.
# The "CPU" device, a Mac's GPU and an AMD APU (all host RAM) always keep a
# tenth of RAM free (at most 16 GiB; at least 2 GiB, or a quarter of RAM under
# 8 GiB). A margin can raise that, never lower it: even margin = 0 and a
# cap_fraction of 1.0 there keep it.
# GET /api/inference/health reports the rule in effect (`reserve_rule`).
# margin = 0.10
# Hard ceiling as a fraction of the GPU's total VRAM, for sharing one card
# between services. Default: off.
# cap_fraction = 0.90
# How far throughput measurements in one batch-size bucket may disagree
# (relative MAD) before the batch-size knee is not fitted. Default 0.20 on a
# GPU, 0.35 on the CPU; a value here applies to both, so to change a single
# device use its override table below.
# knee_max_bucket_dispersion = 0.20

# Per-device overrides, keyed by GPU UUID (`nvidia-smi -L`) or "CPU"; absent
# keys inherit the section above. Uncomment a header together with its keys.
# [inference_local.vram.gpu."GPU-1a2b3c4d-5e6f-7890-abcd-ef1234567890"]
# margin = 0.25
# [inference_local.vram.gpu."CPU"]
# knee_max_bucket_dispersion = 0.35

# Backend video transcoding (docs/video-transcoding-design.md). Every key is a
# tunable default; commented keys track the built-in defaults on upgrade.
# [transcode]
# max_concurrent_jobs = 1
# cache_dir = ""                       # empty = <data_folder>/transcode-cache
# cache_size_mb = 8192
# cache_size_max_mb = 262144           # ceiling for PUT /api/video/cache
# hwaccel = "auto"                     # "auto" | "off" | h264_nvenc | h264_amf | h264_qsv | h264_videotoolbox | h264_mf
# hover_preview = "auto"               # hover preview transcodes: "auto" (only with a hardware encoder) | "on" | "off"
# hover_preview_max_bytes = 16777216   # over this, a hover preview is trimmed to 16 s instead of played whole
# max_mosaic_inputs = 12
# max_mosaic_loop_mb = 512
# max_animated_image_seconds = 30
# max_output_seconds = 300
# compose_light_threshold = 2

# Custom encoding profiles merge by name over the built-ins; a name matching
# no built-in must give at least container, vcodec and a rate control. Absent
# = the built-in presets, an explicit empty table = none at all.
# [transcode.profiles.small-share]
# label = "Small (share)"
# container = "mp4"                    # mp4 | webm | webp
# vcodec = "h264"                      # codec family, not the encoder
# acodec = "aac"                       # or audio = false for no audio track
# crf = 28                             # or bitrate_kbps = 2500
# max_height = 720                     # 0 = uncapped
# channel = "fast"                     # quality | fast
# surfaces = ["clip"]                  # playback | clip | mosaic

[rulesets.allow_all]
allow_all = true

[[policies]]
name = "desktop"
ruleset = "allow_all"

[policies.match]
hosts = ["localhost", "127.0.0.1"]
endpoints = ["default"]

[policies.index_db]
default = "default"
allow = "*"

[policies.user_data_db]
default = "default"
allow = "*"

[policies.client]
desktop = true
home_redirect = "/search"

[logging]
# level defaults to "info". Uncomment to override.
# level = "info"
