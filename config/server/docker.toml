# Panoptikon Gateway configuration for the official Docker image.
#
# Baked into the image at /app/config/server/docker.toml and selected via
# PANOPTIKON_CONFIG_PATH. The compose file mounts a volume over /app/config, so
# this file seeds the volume on the first run and is user-owned afterwards:
# edit it and restart the container to reconfigure. Full reference (every
# key, templating, policies/rulesets): panoptikon/README.md.
#
# Two listeners, one process:
#   6342 "default"  PRIVATE admin — full API (allow_all policy). The API can
#                   open files and trigger arbitrary command execution in the
#                   container; NEVER expose this port to untrusted clients.
#   6339 "public"   PUBLIC — locked to the restricted_demo ruleset below
#                   (search, item/file serving, bookmarks; no jobs/config).

# All persistent state (index DBs, user data, thumbnails), on the data volume.
data_folder = "data"

[logging]
# Console only: containers log to stdout/stderr (`docker logs panoptikon`).
file = ""
level = "${LOGLEVEL:-INFO}"

# "Open file / show in folder" cannot reach a file manager from inside a
# container, so both are disabled here as no-ops. Use Panoptikon Relay on the
# client machine instead (see the README).
#
# The clipboard verb (POST /api/open/clipboard/{sha256}) is deliberately NOT
# disabled: in a container it fails with a clear "no graphical session" error,
# which is more honest than a silent no-op. Client-side copy goes through the
# Relay anyway, never through this endpoint.
[open]
file_command = ""
folder_command = ""

[server]
# 0.0.0.0: listeners must be reachable through Docker's port mapping. Access
# control is the compose port mapping + the policies below.
host = "0.0.0.0"
port = 6342
trust_forwarded_headers = true

# The public listener. Endpoint identity comes from the TCP listener a
# connection arrived on, so it cannot be spoofed via request headers.
[[server.endpoints]]
name = "public"
port = 6339

[upstreams.ui]
# Internal upstream only (the embedded Next.js server the gateway spawns);
# never mapped out of the container.
base_url = "http://127.0.0.1:6340"
local = true
# No UI checkout exists in the image: a nonexistent dir makes the gateway
# fall back to the UI bundle embedded in the binary.
dir = "no-checkout-use-embedded-bundle"
# The image ships a native Node.js.
node = "node"

[upstreams.api]
base_url = "http://127.0.0.1:6342"
local = true

# ffmpeg/ffprobe from the image's apt packages — the venv's static-ffmpeg
# binaries are removed at image build time.
[jobs]
ffmpeg = "/usr/bin/ffmpeg"
ffprobe = "/usr/bin/ffprobe"
# Native render dependencies shipped in the image. The ${VAR:-default}
# templates keep them overridable via container env vars.
#   pdfium: libpdfium.so is copied out of the venv's pypdfium2 to a stable
#           path at build time (PDF thumbnails/extraction).
#   html_renderer: left unset — the built-in search order finds the apt
#           google-chrome-stable at /usr/bin/google-chrome-stable.
pdfium = "${PDFIUM_PATH:-/app/libpdfium.so}"
html_renderer = "${HTML_RENDERER_PATH:-}"
thumbnail_font = "${PANOPTIKON_FONT:-}"
# Chromium refuses to run without a usable sandbox as a non-root user inside
# a container; --disable-dev-shm-usage avoids crashes on Docker's small
# default /dev/shm. Harmless off-container (this key is empty there).
html_renderer_args = ["--no-sandbox", "--disable-dev-shm-usage"]

# In-process inference orchestrator. The Python environment was provisioned
# at image build time (CPU wheels by default; the CUDA image variant is a
# build arg — see the README's Docker section).
[inference_local]
enabled = true

[search]
# Size of the in-process embedding cache. Default: 1024. Uncomment to override
# (leaving it commented tracks the built-in default across image upgrades).
# embedding_cache_size = 1024

# Backend video transcoding (docs/video-transcoding-design.md). Every key is a
# tunable default -- leaving it commented tracks the built-in default across
# image upgrades. Note for nvenc in a container: the NVIDIA container toolkit
# must be present AND NVIDIA_DRIVER_CAPABILITIES must include "video" (the
# common "compute,utility" does not inject libnvidia-encode.so). VAAPI needs
# /dev/dri passed through. Without either, "auto" simply falls back to libx264.
# [transcode]
# max_concurrent_jobs = 1
# cache_dir = ""                       # empty = <data_folder>/transcode-cache
# cache_size_mb = 8192
# cache_size_max_mb = 262144           # ceiling for PUT /api/video/cache
# hwaccel = "auto"                     # "auto" | "off" | h264_nvenc | h264_amf | h264_qsv | h264_videotoolbox | h264_mf
# max_mosaic_inputs = 12
# max_mosaic_loop_mb = 512
# max_animated_image_seconds = 30
# max_output_seconds = 300
# compose_light_threshold = 2

# Custom encoding profiles merge by name over the built-ins; a name matching
# no built-in must give at least container, vcodec and a rate control. Absent
# = the built-in presets, an explicit empty table = none at all.
# [transcode.profiles.small-share]
# label = "Small (share)"
# container = "mp4"                    # mp4 | webm | webp
# vcodec = "h264"                      # codec family, not the encoder
# acodec = "aac"                       # or audio = false for no audio track
# crf = 28                             # or bitrate_kbps = 2500
# max_height = 720                     # 0 = uncapped
# channel = "fast"                     # quality | fast
# surfaces = ["clip"]                  # playback | clip | mosaic

# --------- Rulesets ---------
# Rulesets define which methods + paths are allowed for a policy.
# If a policy references a ruleset, anything not matched is denied.

[rulesets.allow_all]
allow_all = true

# What the public listener may do: search, item metadata/thumbnails/files,
# bookmarks, and read-only DB info. Jobs, config, folder management, and
# inference administration are denied.
[rulesets.restricted_demo]
allow = [
    { methods = [
        "GET",
    ], path_prefix = "/docs" },
    { methods = [
        "GET",
    ], path = "/openapi.json" },

    { methods = [
        "GET",
        "POST",
    ], path_prefix = "/api/search/" },
    { methods = [
        "GET",
    ], path_prefix = "/api/items/" },

    # Serving an already-encoded rendition (and listing the presets) is safe
    # for a public profile; POST /api/video/transcode, which spawns ffmpeg, is
    # deliberately not granted.
    { methods = [
        "GET",
    ], path = "/api/video/artifact" },
    { methods = [
        "GET",
    ], path = "/api/video/presets" },

    { methods = [
        "GET",
        "POST",
        "DELETE",
        "PUT",
    ], path_prefix = "/api/bookmarks/" },

    { methods = [
        "GET",
    ], path = "/api/db" },

    { methods = [
        "GET",
    ], path = "/api/inference/cache" },
]

# --------- Policies ---------
# Policies are checked in order, first match wins: the endpoint-scoped
# public policy must come before the catch-all private one.

[[policies]]
name = "public"
ruleset = "restricted_demo"

[policies.match]
endpoints = ["public"]

[policies.index_db]
default = "default"
# Public visitors may select any index DB via ?index_db=. To confine them to
# specific databases, list them instead: allow = ["public"].
allow = "*"

[policies.user_data_db]
default = "default"
allow = "*"

[policies.client]
# Hide "open on host" controls in the public UI (the API side is a no-op in
# the container and denied by the ruleset regardless).
disable_backend_open = true
# search_throttle_ms = 1500    # throttle instant search for demo visitors

# Private admin: everything arriving on the primary listener, unrestricted.
[[policies]]
name = "private"
ruleset = "allow_all"

[policies.match]
endpoints = ["default"]

[policies.index_db]
default = "default"
allow = "*"

[policies.user_data_db]
default = "default"
allow = "*"
